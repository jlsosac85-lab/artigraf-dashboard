<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avance de Obra · Artigraf Torreón</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root{
    --green:#16a34a; --green2:#22c55e; --blue:#0b3b6f; --blue2:#1e5fae;
    --amber:#f59e0b; --red:#ef4444; --slate:#64748b; --ink:#0f172a; --violet:#7c3aed;
    --bg:#eef2f7; --card:#ffffff; --line:#e3e9f0;
    /* Paleta Cleangy Solar */
    --cl-orange:#F39C12; --cl-teal:#1FA89A; --cl-green:#27AE60; --cl-navy:#1B3A5C;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);
    background:var(--bg) url('watermark.png') repeat;background-size:720px auto;background-attachment:fixed}
  .wrap{max-width:1320px;margin:0 auto;padding:0 20px 48px;position:relative;z-index:1}
  .cintilla{position:relative;background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;overflow:hidden}
  .cintilla::before{content:"";position:absolute;inset:0;opacity:.20;
    background:url('paneles.jpg') center/cover no-repeat}
  .cintilla::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.34);z-index:0}
  .cint-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.26;z-index:0;pointer-events:none}
  .cint-row{position:relative;z-index:1;max-width:1150px;margin:0 auto;display:flex;align-items:center;justify-content:space-evenly;gap:28px;flex-wrap:wrap}
  .cl-logo{width:auto;object-fit:contain;display:block}
  .cl-cle{height:89px} .cl-art{height:90px} .cl-fw{height:53px}
  header{background:linear-gradient(135deg,#0b3b6f 0%,#0e6b46 55%,#16a34a 100%);color:#fff;border-radius:0 0 22px 22px;
    padding:20px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    position:relative;box-shadow:0 10px 30px rgba(11,59,111,.18)}
  header h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:14px}
  header h1 .sun{font-size:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
  header .sub{margin-top:4px;font-size:13px;opacity:.92;font-weight:500}
  .btn{position:absolute;right:24px;top:20px;background:#fff;color:#0e6b46;border:none;border-radius:10px;padding:10px 15px;
    font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;font-family:inherit;
    box-shadow:0 4px 12px rgba(0,0,0,.12);transition:.15s}
  .btn:hover{transform:translateY(-1px)}
  .updated{position:absolute;right:24px;top:58px;font-size:11px;opacity:.85}
  .sec{display:flex;align-items:center;gap:9px;margin:26px 2px 12px;font-size:16px;font-weight:800;color:var(--blue)}
  .sec .bar{width:4px;height:18px;border-radius:3px;background:var(--green)}
  /* Cintilla de datos del proyecto con bordes/divisores */
  .proj{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 0;
    background:linear-gradient(160deg,rgba(233,247,242,.92),rgba(230,240,250,.92));
    border:1.5px solid var(--cl-teal);border-radius:14px;padding:14px 10px;margin-top:18px;overflow:hidden}
  .proj div{font-size:13px;color:var(--slate);padding:2px 22px} .proj b{color:var(--ink)}
  .proj div:not(:last-child){border-right:1.5px solid rgba(31,168,154,.35)}
  /* KPIs principales */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .kpi{border:1px solid var(--line);border-radius:14px;padding:22px 16px 18px;position:relative;overflow:hidden;text-align:center;
    background:linear-gradient(160deg,#ffffff 0%,#e9f9ef 100%);box-shadow:0 2px 8px rgba(15,23,42,.05)}
  .kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--green)}
  .kpi .lab{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--slate);font-weight:700}
  .kpi .val{font-size:38px;font-weight:800;margin:10px 0 4px;line-height:1}
  .kpi .hint{font-size:12px;color:var(--slate);font-weight:500}
  .kpi.k-blue{background:linear-gradient(160deg,#ffffff 0%,#e6f0fd 100%)}
  .kpi.k-amber{background:linear-gradient(160deg,#ffffff 0%,#fef4e3 100%)}
  .kpi.k-red{background:linear-gradient(160deg,#ffffff 0%,#fde9e9 100%)}
  .kpi.k-slate{background:linear-gradient(160deg,#ffffff 0%,#eaeff5 100%)}
  .kpi.k-violet{background:linear-gradient(160deg,#ffffff 0%,#efeafe 100%)}
  .kpi.k-blue::before{background:var(--blue2)} .kpi.k-amber::before{background:var(--amber)}
  .kpi.k-red::before{background:var(--red)} .kpi.k-slate::before{background:var(--slate)}
  .kpi.k-violet::before{background:var(--violet)}
  .v-green{color:var(--green)} .v-blue{color:var(--blue2)} .v-amber{color:var(--amber)}
  .v-red{color:var(--red)} .v-ink{color:var(--ink)} .v-violet{color:var(--violet)} .v-teal{color:var(--cl-teal)} .v-slate{color:var(--slate)}
  /* KPIs por etapa (9) */
  .etapas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .etapa{border:1px solid var(--line);border-radius:12px;padding:15px 12px;text-align:center;position:relative;overflow:hidden;
    background:linear-gradient(160deg,#ffffff 0%,#eafaf4 100%);box-shadow:0 1px 5px rgba(15,23,42,.04)}
  .etapa::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cl-teal),var(--cl-green))}
  .etapa .en{font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.3px}
  .etapa .ev{font-size:27px;font-weight:800;margin:7px 0 2px;line-height:1}
  .etapa .ew{font-size:10.5px;color:var(--slate)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  .grid-site{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:18px}
  /* Paneles con paleta Cleangy */
  .panel{background:linear-gradient(150deg,rgba(233,247,242,.90) 0%,rgba(231,241,251,.90) 100%);
    border:1px solid #d4e6df;border-radius:16px;padding:18px 20px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .panel h3{margin:0;font-size:15px;font-weight:800;color:var(--cl-navy);text-align:center}
  .head-row{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .filters select,.filters input{font-family:inherit;font-size:12px;padding:6px 9px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);outline:none;max-width:170px}
  .filters input{min-width:150px}
  .filters select:focus,.filters input:focus{border-color:var(--cl-teal)}
  .chart-box{position:relative;height:300px}
  .chart-box.tall{height:340px}
  .hito{margin-bottom:13px}
  .hito .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
  .hito .nm{font-weight:600} .hito .pc{font-weight:700}
  .track{height:9px;background:rgba(255,255,255,.7);border-radius:6px;overflow:hidden}
  .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cl-teal),var(--cl-green));transition:width .6s}
  .hito .meta{font-size:10.5px;color:var(--slate);margin-top:3px}
  .planta{width:100%;height:320px;object-fit:cover;border-radius:12px;display:block}
  .planta-ph{height:320px;border:2px dashed var(--cl-teal);border-radius:12px;display:flex;align-items:center;justify-content:center;
    color:var(--slate);font-size:13px;text-align:center;padding:20px;background:linear-gradient(160deg,#ffffff,#eaf6f1)}
  .wx-now{display:flex;align-items:center;gap:14px;margin-bottom:14px;background:linear-gradient(135deg,#e8f1fd,#e3f3ec);
    border:1px solid #d4e6df;border-radius:12px;padding:12px 16px}
  .wx-now .ic{font-size:44px;line-height:1}
  .wx-now .t{font-size:34px;font-weight:800;line-height:1;color:var(--cl-navy)}
  .wx-now .meta{font-size:12px;color:var(--slate);margin-top:3px}
  .wx-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
  .wx-day{background:linear-gradient(160deg,#ffffff,#e9f4ef);border:1px solid #d4e6df;border-radius:10px;padding:9px 3px}
  .wx-day .d{font-size:10.5px;font-weight:700;color:var(--slate);text-transform:capitalize}
  .wx-day .di{font-size:22px;margin:4px 0}
  .wx-day .mx{font-size:13px;font-weight:800;color:var(--cl-navy)}
  .wx-day .mn{font-size:11px;color:var(--slate)}
  .wx-day .pp{font-size:9.5px;color:var(--cl-teal);margin-top:2px}
  /* Tablas con paleta Cleangy */
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:transparent}
  th{text-align:left;color:#fff;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;
    padding:10px;background:linear-gradient(90deg,var(--cl-navy),var(--cl-teal) 70%,var(--cl-green))}
  td{padding:9px 10px;border-bottom:1px solid rgba(31,168,154,.15)}
  tbody tr:nth-child(even) td{background:rgba(31,168,154,.07)}
  tr:hover td{background:rgba(31,168,154,.16)}
  thead tr th:first-child{border-radius:8px 0 0 0} thead tr th:last-child{border-radius:0 8px 0 0}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
  .b-pend{background:#eef2f7;color:#475569} .b-proc{background:#fef3c7;color:#b45309}
  .b-comp{background:#dcfce7;color:#15803d} .b-canc{background:#fee2e2;color:#b91c1c}
  .scroll{max-height:430px;overflow:auto;border-radius:10px}
  .empty{padding:18px;text-align:center;color:var(--slate);font-size:12.5px}
  .footer{margin-top:30px;text-align:center;color:var(--slate);font-size:12px}
  .loading{padding:60px;text-align:center;color:var(--slate)}
  .errbox{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:18px;margin-top:18px;font-size:13px}
  @media(max-width:1000px){.grid2,.grid3,.grid-site{grid-template-columns:1fr}}
  @media(max-width:640px){.kpis,.etapas{grid-template-columns:repeat(2,1fr)}.btn,.updated{position:static;margin-top:10px}}

  /* --- Galería de avances --- */
  .gal-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;justify-content:center}
  .gal-tab{border:1.5px solid var(--cl-navy,#1B3A5C);background:#fff;color:var(--cl-navy,#1B3A5C);
    font:700 13px 'Plus Jakarta Sans',sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.15s}
  .gal-tab.on{background:var(--cl-navy,#1B3A5C);color:#fff}
  .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .gal-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:zoom-in;
    box-shadow:0 2px 8px rgba(27,58,92,.18);transition:transform .15s}
  .gal-grid img:hover{transform:scale(1.03)}
  .gal-count{text-align:center;color:#64748b;font-size:12.5px;margin-top:10px}
  #gal-lb{position:fixed;inset:0;background:rgba(10,20,35,.92);display:none;align-items:center;
    justify-content:center;z-index:999;cursor:zoom-out;flex-direction:column;gap:10px}
  #gal-lb img{max-width:92vw;max-height:84vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
  #gal-lb .lb-cap{color:#cbd5e1;font-size:13px}
  #gal-lb .lb-nav{position:fixed;top:50%;transform:translateY(-50%);font-size:44px;color:#fff;
    cursor:pointer;user-select:none;padding:0 18px;opacity:.75}
  #gal-lb .lb-nav:hover{opacity:1}

  
  /* --- Orden por columna --- */
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{filter:brightness(1.12)}
  th.sortable .arr{font-size:10px;margin-left:5px;opacity:.45}
  th.sortable.s-on .arr{opacity:1}

  </style>
</head>
<body>
<div class="cintilla">
  <video class="cint-video" autoplay muted loop playsinline preload="auto" onerror="this.style.display='none'">
    <source src="paneles.mp4" type="video/mp4" />
  </video>
  <div class="cint-row">
    <img class="cl-logo cl-cle" src="logo-cleangy.png" alt="Cleangy Solar" />
    <img class="cl-logo cl-art" src="logo-artigraf.png" alt="Artigraf" />
    <img class="cl-logo cl-fw" src="logo-firmahw.png" alt="Firma HW" />
  </div>
</div>
<header>
  <h1><span class="sun">☀️</span> Avance de Obra <span class="sun">☀️</span></h1>
  <div class="sub" id="hsub">Artigraf · Planta Torreon — cargando…</div>
  <button class="btn" onclick="cargar()">⟳ Actualizar</button>
  <div class="updated" id="updated"></div>
</header>

<div class="wrap">
  <div id="app"><div class="loading">Cargando datos del proyecto…</div></div>
</div>

<script>
const $ = (id)=>document.getElementById(id);
let charts = {};

function pct(n){ if(n==null) return "—"; return (Math.round(n*10)/10).toString().replace(/\.0$/,"") + "%"; }
function badge(s){
  const m={"Completado":"b-comp","En proceso":"b-proc","Pendiente":"b-pend","Cancelado":"b-canc"};
  return `<span class="badge ${m[s]||'b-pend'}">${s}</span>`;
}
function esc(s){ return (s==null?'':String(s)).replace(/"/g,'&quot;'); }
function hitoState(a){ return a>=100?'Completado': a>0?'En proceso':'Pendiente'; }
function valColor(a){ return a>=100?'v-green': a>0?'v-teal':'v-slate'; }


// ===== Galería de avances (fotos de los reportes semanales, en public/avances/) =====
const GALERIA = [{"id": "sem1", "label": "29 jun – 3 jul", "fotos": ["av-sem1-01.jpg", "av-sem1-02.jpg", "av-sem1-03.jpg", "av-sem1-04.jpg", "av-sem1-05.jpg", "av-sem1-06.jpg"]}, {"id": "sem2", "label": "6 – 11 jul", "fotos": ["av-sem2-01.jpg", "av-sem2-02.jpg", "av-sem2-03.jpg", "av-sem2-04.jpg", "av-sem2-05.jpg", "av-sem2-06.jpg", "av-sem2-07.jpg", "av-sem2-08.jpg", "av-sem2-09.jpg"]}, {"id": "sem3", "label": "13 – 18 jul", "fotos": ["av-sem3-01.jpg", "av-sem3-02.jpg", "av-sem3-03.jpg", "av-sem3-04.jpg", "av-sem3-05.jpg", "av-sem3-06.jpg", "av-sem3-07.jpg", "av-sem3-08.jpg", "av-sem3-09.jpg"]}, {"id": "sem4", "label": "20 – 25 jul", "fotos": ["av-sem4-01.jpg", "av-sem4-02.jpg", "av-sem4-03.jpg", "av-sem4-04.jpg", "av-sem4-05.jpg", "av-sem4-06.jpg", "av-sem4-07.jpg", "av-sem4-08.jpg", "av-sem4-09.jpg", "av-sem4-10.jpg", "av-sem4-11.jpg", "av-sem4-12.jpg", "av-sem4-13.jpg", "av-sem4-14.jpg", "av-sem4-15.jpg", "av-sem4-16.jpg", "av-sem4-17.jpg", "av-sem4-18.jpg", "av-sem4-19.jpg", "av-sem4-20.jpg", "av-sem4-21.jpg", "av-sem4-22.jpg", "av-sem4-23.jpg", "av-sem4-24.jpg", "av-sem4-25.jpg", "av-sem4-26.jpg", "av-sem4-27.jpg", "av-sem4-28.jpg", "av-sem4-29.jpg", "av-sem4-30.jpg", "av-sem4-31.jpg", "av-sem4-32.jpg", "av-sem4-33.jpg"]}, {"id": "sem5", "label": "27 – 30 jul", "fotos": ["av-sem5-01.jpg", "av-sem5-02.jpg", "av-sem5-03.jpg", "av-sem5-04.jpg", "av-sem5-05.jpg", "av-sem5-06.jpg"]}, {"id": "sem6", "label": "3 – 8 ago", "fotos": ["av-sem6-01.jpg", "av-sem6-02.jpg", "av-sem6-03.jpg", "av-sem6-04.jpg", "av-sem6-05.jpg", "av-sem6-06.jpg", "av-sem6-07.jpg", "av-sem6-08.jpg", "av-sem6-09.jpg", "av-sem6-10.jpg", "av-sem6-11.jpg", "av-sem6-12.jpg"]}, {"id": "sem7", "label": "10 – 14 ago", "fotos": ["av-sem7-01.jpg", "av-sem7-02.jpg", "av-sem7-03.jpg", "av-sem7-04.jpg", "av-sem7-05.jpg", "av-sem7-06.jpg", "av-sem7-07.jpg", "av-sem7-08.jpg", "av-sem7-09.jpg", "av-sem7-10.jpg", "av-sem7-11.jpg", "av-sem7-12.jpg", "av-sem7-13.jpg"]}, {"id": "sem8", "label": "17 – 21 ago", "fotos": ["av-sem8-01.jpg", "av-sem8-02.jpg", "av-sem8-03.jpg", "av-sem8-04.jpg", "av-sem8-05.jpg", "av-sem8-06.jpg", "av-sem8-07.jpg", "av-sem8-08.jpg", "av-sem8-09.jpg", "av-sem8-10.jpg", "av-sem8-11.jpg", "av-sem8-12.jpg", "av-sem8-13.jpg", "av-sem8-14.jpg"]}, {"id": "sem9", "label": "24 – 28 ago", "fotos": ["av-sem9-01.jpg", "av-sem9-02.jpg", "av-sem9-03.jpg", "av-sem9-04.jpg", "av-sem9-05.jpg", "av-sem9-06.jpg", "av-sem9-07.jpg", "av-sem9-08.jpg", "av-sem9-09.jpg", "av-sem9-10.jpg", "av-sem9-11.jpg", "av-sem9-12.jpg", "av-sem9-13.jpg", "av-sem9-14.jpg", "av-sem9-15.jpg", "av-sem9-16.jpg", "av-sem9-17.jpg", "av-sem9-18.jpg", "av-sem9-19.jpg"]}, {"id": "sem10", "label": "31 ago – 4 sep", "fotos": ["av-sem10-01.jpg", "av-sem10-02.jpg", "av-sem10-03.jpg", "av-sem10-04.jpg", "av-sem10-05.jpg", "av-sem10-06.jpg", "av-sem10-07.jpg", "av-sem10-08.jpg"]}];
let galWeek = GALERIA.length - 1, galIdx = 0;
function galSrc(w,f){ return f; }  // fotos planas en public/
function drawGaleria(){
  const tabs = document.getElementById('gal-tabs'); if(!tabs) return;
  tabs.innerHTML = GALERIA.map((w,i)=>`<button class="gal-tab ${i===galWeek?'on':''}" onclick="galSel(${i})">${w.label}</button>`).join('');
  const w = GALERIA[galWeek];
  document.getElementById('gal-grid').innerHTML =
    w.fotos.map((f,i)=>`<img loading="lazy" src="${galSrc(w,f)}" alt="Avance ${w.label}" onclick="galOpen(${i})">`).join('');
  document.getElementById('gal-count').textContent = w.fotos.length + ' fotografías · Semana del ' + w.label;
}
function galSel(i){ galWeek = i; drawGaleria(); }
function galOpen(i){
  galIdx = i;
  let lb = document.getElementById('gal-lb');
  if(!lb){
    lb = document.createElement('div'); lb.id = 'gal-lb';
    lb.innerHTML = `<span class="lb-nav" style="left:0" onclick="event.stopPropagation();galMove(-1)">‹</span>
      <img id="gal-lb-img"><div class="lb-cap" id="gal-lb-cap"></div>
      <span class="lb-nav" style="right:0" onclick="event.stopPropagation();galMove(1)">›</span>`;
    lb.onclick = ()=>{ lb.style.display='none'; };
    document.body.appendChild(lb);
    document.addEventListener('keydown', e=>{
      if(lb.style.display!=='flex') return;
      if(e.key==='Escape') lb.style.display='none';
      if(e.key==='ArrowLeft') galMove(-1);
      if(e.key==='ArrowRight') galMove(1);
    });
  }
  galShow(); lb.style.display='flex';
}
function galMove(d){
  const w = GALERIA[galWeek];
  galIdx = (galIdx + d + w.fotos.length) % w.fotos.length;
  galShow();
}
function galShow(){
  const w = GALERIA[galWeek];
  document.getElementById('gal-lb-img').src = galSrc(w, w.fotos[galIdx]);
  document.getElementById('gal-lb-cap').textContent = 'Semana del ' + w.label + ' · foto ' + (galIdx+1) + ' de ' + w.fotos.length;
}


// ===== Ordenamiento de tablas por columna =====
const RE_FECHA=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/;
function sortVal(td){
  const t=(td.textContent||'').trim();
  if(t==='—'||t==='') return null;
  const m=t.match(RE_FECHA);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]).getTime();
  const n=parseFloat(t.replace('%','').replace(/,/g,''));
  if(!isNaN(n) && /^[\d.,]+%?$/.test(t)) return n;
  return t.toLowerCase();
}
function makeSortable(tbodyId){
  const tbody=document.getElementById(tbodyId); if(!tbody) return;
  const table=tbody.closest('table');
  const ths=table.querySelectorAll('thead th');
  ths.forEach((th,ci)=>{
    th.classList.add('sortable');
    if(!th.querySelector('.arr')){ const s=document.createElement('span'); s.className='arr'; s.textContent='↕'; th.appendChild(s); }
    th.onclick=()=>{
      const dir = th.dataset.dir==='asc' ? 'desc' : 'asc';
      ths.forEach(o=>{ o.dataset.dir=''; o.classList.remove('s-on'); const a=o.querySelector('.arr'); if(a) a.textContent='↕'; });
      th.dataset.dir=dir; th.classList.add('s-on');
      th.querySelector('.arr').textContent = dir==='asc'?'▲':'▼';
      const rows=[...tbody.querySelectorAll('tr')].filter(r=>!r.querySelector('td[colspan]'));
      rows.sort((a,b)=>{
        const va=sortVal(a.cells[ci]), vb=sortVal(b.cells[ci]);
        if(va===null && vb===null) return 0;
        if(va===null) return 1;              // vacíos siempre al final
        if(vb===null) return -1;
        let c;
        if(typeof va==='string' || typeof vb==='string') c=String(va).localeCompare(String(vb),'es');
        else c=va-vb;
        return dir==='asc'?c:-c;
      });
      rows.forEach(r=>tbody.appendChild(r));
    };
  });
}
function initSort(){ makeSortable('prox-body'); makeSortable('det-body'); }

async function cargar(){
  if(window.__PREVIEW__){ render(window.__PREVIEW__); return; }
  $("app").innerHTML = '<div class="loading">Cargando datos del proyecto…</div>';
  let d;
  try{
    let r = await fetch('/api/data?t='+Date.now());
    if(!r.ok){ throw new Error((await r.json()).detalle || ('HTTP '+r.status)); }
    d = await r.json();
  }catch(e){
    try{ d = await (await fetch('./sample-data.json?t='+Date.now())).json(); }
    catch(_){ $("app").innerHTML = `<div class="errbox"><b>No se pudieron cargar los datos.</b><br>${e.message}</div>`; return; }
  }
  render(d);
}

function weatherInfo(c){
  if(c===0) return ['☀️','Despejado'];
  if(c<=2) return ['🌤️','Poco nublado'];
  if(c===3) return ['☁️','Nublado'];
  if(c<=48) return ['🌫️','Niebla'];
  if(c<=57) return ['🌦️','Llovizna'];
  if(c<=67) return ['🌧️','Lluvia'];
  if(c<=77) return ['🌨️','Nieve'];
  if(c<=82) return ['🌧️','Chubascos'];
  if(c<=86) return ['🌨️','Nieve'];
  return ['⛈️','Tormenta'];
}
async function loadWeather(){
  const el=$("weather"); if(!el) return;
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude=25.5428&longitude=-103.4068&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7';
    const w=await (await fetch(u)).json();
    const cur=w.current, dy=w.daily;
    const [ci,ct]=weatherInfo(cur.weather_code);
    const dias=dy.time.map((t,i)=>{
      const d=new Date(t+'T12:00:00');
      const wd=d.toLocaleDateString('es-MX',{weekday:'short'}).replace('.','');
      const [ic]=weatherInfo(dy.weather_code[i]);
      return `<div class="wx-day"><div class="d">${wd}</div><div class="di">${ic}</div><div class="mx">${Math.round(dy.temperature_2m_max[i])}°</div><div class="mn">${Math.round(dy.temperature_2m_min[i])}°</div><div class="pp">💧${dy.precipitation_probability_max[i]??0}%</div></div>`;
    }).join('');
    el.innerHTML=`
      <div class="wx-now">
        <div class="ic">${ci}</div>
        <div><div class="t">${Math.round(cur.temperature_2m)}°C</div>
        <div class="meta">${ct} · Humedad ${cur.relative_humidity_2m}% · Viento ${Math.round(cur.wind_speed_10m)} km/h</div></div>
      </div>
      <div class="wx-days">${dias}</div>`;
  }catch(e){ el.innerHTML='<div class="empty">No se pudo cargar el clima.</div>'; }
}

function applyHitoFilter(){
  const v=$("f-hito").value;
  document.querySelectorAll('#hitos .hito').forEach(el=>{
    el.style.display = (v==='all'||el.dataset.state===v)?'':'none';
  });
}
function applyProxFilter(){
  const h=$("f-prox-hito").value, q=$("f-prox-q").value.toLowerCase().trim();
  let vis=0;
  document.querySelectorAll('#prox-body tr').forEach(tr=>{
    const okH = h==='all' || tr.dataset.hito===h;
    const okQ = !q || tr.textContent.toLowerCase().includes(q);
    const show = okH&&okQ; tr.style.display = show?'':'none'; if(show) vis++;
  });
  $("prox-empty").style.display = vis?'none':'';
}
function applyDetFilter(){
  const h=$("f-det-hito").value, e=$("f-det-est").value, q=$("f-det-q").value.toLowerCase().trim();
  let vis=0;
  document.querySelectorAll('#det-body tr').forEach(tr=>{
    const okH = h==='all' || tr.dataset.hito===h;
    const okE = e==='all' || tr.dataset.est===e;
    const okQ = !q || tr.textContent.toLowerCase().includes(q);
    const show = okH&&okE&&okQ; tr.style.display = show?'':'none'; if(show) vis++;
  });
  $("det-empty").style.display = vis?'none':'';
}

function drawHitos(hitos){
  $("hitos").innerHTML = hitos.map(h=>`
    <div class="hito" data-state="${hitoState(h.avance)}">
      <div class="top"><span class="nm">${h.nombre} <span style="color:#94a3b8;font-weight:500">· ${h.peso}%</span></span><span class="pc">${pct(h.avance)}</span></div>
      <div class="track"><div class="fill" style="width:${Math.max(2,h.avance)}%"></div></div>
      <div class="meta">${h.inicio||'—'} → ${h.fin||'—'} · ${h.dias||0} días</div>
    </div>`).join('');
}

function drawCurva(curva, real){
  if(charts.curva) charts.curva.destroy();
  const labels = curva.map(p=>p.fecha.slice(0,5));
  const prog = curva.map(p=>p.programado);
  const hoy = new Date();
  let idx = 0, best = Infinity;
  curva.forEach((p,i)=>{ const [dd,mm,yy]=p.fecha.split('/'); const dt=new Date(+yy,+mm-1,+dd);
    const diff=Math.abs(dt-hoy); if(diff<best){best=diff;idx=i;} });
  const realData = curva.map((_,i)=> i===idx ? real : null);
  charts.curva = new Chart($("curva"),{
    type:'line',
    data:{labels,datasets:[
      {label:'Programado',data:prog,borderColor:'#1B3A5C',backgroundColor:'rgba(31,168,154,.12)',fill:true,tension:.3,pointRadius:0,borderWidth:2.5},
      {label:'Real',data:realData,borderColor:'#27AE60',backgroundColor:'#27AE60',pointRadius:6,pointHoverRadius:7,showLine:false}
    ]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'Plus Jakarta Sans',weight:'600'},usePointStyle:true}},datalabels:{display:false},
      tooltip:{callbacks:{label:(c)=>c.dataset.label+': '+(c.parsed.y==null?'—':c.parsed.y+'%')}}},
      scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%',font:{family:'Plus Jakarta Sans'}},grid:{color:'rgba(31,168,154,.12)'}},
        x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:8,font:{family:'Plus Jakarta Sans'}},grid:{display:false}}}}
  });
}

function drawDonut(est){
  if(charts.donut) charts.donut.destroy();
  const order=[["Completado","#27AE60"],["En proceso","#F39C12"],["Pendiente","#1FA89A"],["Cancelado","#ef4444"]];
  const labels=[],data=[],colors=[];
  order.forEach(([k,c])=>{ if(est[k]){labels.push(k);data.push(est[k]);colors.push(c);} });
  charts.donut = new Chart($("donut"),{
    type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:2,borderColor:'#fff'}]},
    options:{maintainAspectRatio:false,cutout:'62%',
      plugins:{legend:{position:'bottom',labels:{font:{family:'Plus Jakarta Sans',weight:'600'},usePointStyle:true,padding:14}},
        datalabels:{color:'#fff',font:{family:'Plus Jakarta Sans',weight:'800',size:13},formatter:(v)=>v}},}
  });
}
